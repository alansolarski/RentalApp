name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud analysis

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarCloud scanner
        if: ${{ secrets.SONAR_TOKEN != '' }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Create CI appsettings.json
        run: |
          cat > RentalApp.Database/appsettings.json << 'EOF2'
          {
            "ConnectionStrings": {
              "DevelopmentConnection": "Host=localhost;Port=5432;Username=app_user;Password=app_password;Database=appdb"
            }
          }
          EOF2

      - name: Begin SonarCloud analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          dotnet-sonarscanner begin \
            /k:"alansolarski_RentalApp" \
            /o:"alansolarski" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Restore dependencies
        run: dotnet restore RentalApp.Database/RentalApp.Database.csproj

      - name: Build Database library
        run: dotnet build RentalApp.Database/RentalApp.Database.csproj --no-restore -c Debug

      - name: Restore test dependencies
        run: dotnet restore RentalApp.Test/RentalApp.Test.csproj

      - name: Build test project
        run: dotnet build RentalApp.Test/RentalApp.Test.csproj --no-restore -c Debug

      - name: Run tests with coverage
        run: dotnet test RentalApp.Test/RentalApp.Test.csproj --no-build -c Debug --verbosity normal --collect:"XPlat Code Coverage" --settings RentalApp.Test/coverlet.runsettings -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"